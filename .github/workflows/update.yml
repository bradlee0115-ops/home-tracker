name: Update data

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 (한국시간)
    - cron: "0 10 * * *"   # 매일 19:00 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          REB_STATBL_ID: ${{ secrets.REB_STATBL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
